<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VersaDown+</title>
  <style>
    :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
    body { box-sizing: border-box; width: 300px; margin: 0; padding: 16px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-weight: 650; }
    input { width: 18px; height: 18px; margin: 0; accent-color: #13745e; }
    p { line-height: 1.45; margin: 8px 0 0; }
    output { display: block; margin-top: 8px; }
    output:empty { display: none; }
  </style>
  <script src="detection-scope.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <label for="detect-all">
    <span id="label"></span>
    <input type="checkbox" id="detect-all" role="switch" aria-describedby="help" disabled>
  </label>
  <p id="help"></p>
  <output id="status" aria-live="polite"></output>
</body>
</html>
