name: Desktop checks

on:
  pull_request:
  push:
    branches: [master, main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows · x86_64
            runner: windows-2022
          - name: Linux · x86_64
            runner: ubuntu-22.04
          - name: macOS · Apple Silicon (ARM64)
            runner: macos-15
          - name: macOS · Intel (x86_64)
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Check development build identity
        run: pnpm exec vitest run src/components/BuildIdentityFooter.test.tsx --exclude '.worktrees/**'
      - name: Check frontend and platform resource contracts
        run: |
          pnpm exec vitest run src/lib/api.test.ts src/lib/downloadEvents.test.ts src/lib/launcherWindow.test.ts src/lib/mainWindow.test.ts src/lib/windowCapabilities.test.ts src/lib/nativeMenuLabels.test.ts src/components/LauncherWindow.test.tsx src/components/FloatingLauncher.test.tsx src/components/StartupNotice.test.tsx src/components/SettingsPanel.test.tsx src/components/LocalUploadPicker.test.tsx src/components/CloudManager.test.tsx src/App.live.test.tsx src/i18n/index.test.ts --exclude '.worktrees/**'
          node --test scripts/bundle-resource-config.test.mjs scripts/prepare-video-extractor.test.mjs
          node --test scripts/test-xunlei-auth-plugin.cjs
      - name: Check Agent CLI, MCP and task permissions
        run: |
          pnpm exec vitest run src/components/AgentAccessSettings.test.tsx src/components/AgentCloudGrants.test.tsx src/components/AgentConnect.test.tsx src/components/AgentInteractionWindow.test.tsx --exclude '.worktrees/**'
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cli_
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib agent_
          cargo test --locked --manifest-path src-tauri/Cargo.toml --bin vd-cli --bin vd-mcp-server
      - name: Check cloud login completion and shared upload handling
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib browser_password
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib upload_commands
      - name: Check Thunder cloud download engine
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib xunlei_native
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib mac_xunlei
          pnpm exec vitest run src/components/DownloadQueue.test.tsx src/lib/downloadNotifications.test.ts -t 'Mac native channel|native submit failure' --exclude '.worktrees/**'
      - name: Check video page selection, routing and download recovery
        run: |
          pnpm exec vitest run src/components/VideoDownloads.test.tsx src/components/useDownloadDraftBatch.test.tsx src/components/NewDownloadDialog.test.tsx src/components/ParseConfirmDialog.test.tsx --exclude '.worktrees/**'
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib video
      - name: Check Linux video bundle packaging
        if: runner.os == 'Linux'
        run: node --test scripts/build-linux-release.test.mjs
      - name: Check native download and window behavior
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --test engine_binary --test aria2_live --test parser_policy --test window_config --test window_lifecycle --test engine_runtime --test ftp_download --test cloud_provider_contract --test cloud_baidu --test aria2_bt --test magnet_metadata
      - name: Check native menu labels and launcher actions
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_menu_labels::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib launcher::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test launcher_native
      - name: Check cloud range streaming and retry recovery
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test range_gateway --test cloud_gateway_proxy --test downloader
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib aria2::native_resume::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib aria2::service::tests
      - name: Check MEGA encryption, account changes and empty-file streaming
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud::mega::
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test mega_range_gateway
          pnpm exec vitest run src/components/CloudWorkspace.test.tsx src/lib/cloudApi.test.ts src/lib/queueTask.test.ts src/i18n/shareFailureMessage.test.ts --exclude '.worktrees/**'
      - name: Check Quark download cookie binding
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test cloud_quark --test quark_cookie_binding
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud::http::cookie_snapshot_tests
      - name: Check parser and startup failure handling
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib parser::
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud::uc::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test live_share_matrix --no-run
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib staged_torrent
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib enforces_each_provider_share_code_constraint_before_submitting
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud::baidu::tests::share_transfer_
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud::xunlei::tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud::xunlei::diagnostics_tests::
          cargo test --locked --manifest-path src-tauri/Cargo.toml --test cloud_xunlei --test cloud_auth_supervisor --test cloud_sessions
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib unavailable_credential_storage_does_not_reset_or_delete_saved_accounts
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib macos_cookie_scope_tests
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib private_history_reset
      - name: Upload and Quark share regression (isolated credentials)
        env:
          VERSADOWN_NATIVE_SMOKE: '1'
          VERSADOWN_BACKGROUND_UI_TEST: '1'
          VERSADOWN_TEST_DATA_DIR: ${{ runner.temp }}/versadown-upload-regression
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features native-smoke --test cloud_upload
          cargo test --locked --manifest-path src-tauri/Cargo.toml --features native-smoke --lib cloud::quark::tests
      - name: Check macOS encrypted credentials without accessing Keychain
        if: runner.os == 'macOS'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud::credentials::macos::tests
      - name: Check Windows encrypted cloud sessions with isolated credentials
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib cloud::credentials::windows::tests
      - name: Check macOS native launcher, cookies and graceful quit
        if: runner.os == 'macOS'
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features native-smoke --test macos_native_smoke
      - name: Build native application with embedded frontend
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml --features custom-protocol,gui-subsystem
