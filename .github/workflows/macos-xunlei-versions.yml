name: Mac Thunder compatibility

on:
  push:
    branches: ['ci/macos-xunlei-versions']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-xunlei-versions-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  verify:
    if: github.repository == 'hotwar/versadown' && github.ref == 'refs/heads/ci/macos-xunlei-versions'
    name: Verify signed Thunder clients on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Test Thunder download and task handling
        id: tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib xunlei
      - name: Download and resume with Thunder 5.80.6 (66655)
        run: bash scripts/verify-macos-thunder-build.sh 5.80.6.66655
      - name: Download and resume with Thunder 5.80.7 (66659)
        if: "!cancelled() && steps.tests.outcome == 'success'"
        run: bash scripts/verify-macos-thunder-build.sh 5.80.7.66659
      - name: Download and resume with Thunder 5.80.8 (66675)
        if: "!cancelled() && steps.tests.outcome == 'success'"
        run: bash scripts/verify-macos-thunder-build.sh 5.80.8.66675

  installer:
    if: github.repository == 'hotwar/versadown' && github.ref == 'refs/heads/ci/macos-xunlei-versions'
    name: Build ${{ matrix.platform }} test installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS-arm64
            runner: macos-15
            target: target
          - platform: Windows-x86_64
            runner: windows-2022
            target: ../.tools/release-target
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Build and checksum the test DMG
        if: runner.os == 'macOS'
        run: |
          pnpm run build:macos:installer
          mkdir -p artifacts/test-installer
          version=$(node -p "require('./package.json').version")
          name="VersaDown_${version}_arm64_test-${GITHUB_SHA:0:8}.dmg"
          mv "artifacts/macos-arm64/VersaDown_${version}_arm64-local.dmg" "artifacts/test-installer/$name"
          cd artifacts/test-installer
          shasum -a 256 "$name" > SHA256SUMS
          shasum -a 256 --check SHA256SUMS
      - name: Build the test NSIS installer
        if: runner.os == 'Windows'
        run: pnpm run build:windows:installer
      - name: Prepare and checksum the test EXE
        if: runner.os == 'Windows'
        shell: bash
        run: |
          shopt -s nullglob
          installers=(.tools/release-target/release/bundle/nsis/*.exe)
          test "${#installers[@]}" -eq 1
          mkdir -p artifacts/test-installer
          version=$(node -p "require('./package.json').version")
          name="VersaDown_${version}_x64_test-${GITHUB_SHA:0:8}-setup.exe"
          mv "${installers[0]}" "artifacts/test-installer/$name"
          cd artifacts/test-installer
          sha256sum "$name" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: VersaDown-${{ matrix.platform }}-${{ github.sha }}
          path: artifacts/test-installer/
          if-no-files-found: error
          compression-level: 0
